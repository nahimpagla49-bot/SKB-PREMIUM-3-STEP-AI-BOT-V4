const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters =
"01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const chars = letters.split("");

const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff00";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text=
        chars[Math.floor(Math.random()*chars.length)];

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );

        if(
            drops[i]*fontSize >
            canvas.height &&
            Math.random()>0.975
        ){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,33);

  if (bigCount === smallCount) finalPred = v4;
  else finalPred = (bigCount > smallCount) ? 'BIG' : 'SMALL';

  const isBig = (finalPred === 'BIG');
  let rawNum = Math.floor(Math.abs(wv) * 1000) % 10;
  let n1 = rawNum;
  if (isBig) { if (n1 < 5) n1 += 5; }
  else { if (n1 >= 5) n1 -= 5; }
  let n2 = (n1 + 5) % 10;

  // update display
  document.getElementById('pid').innerText = "PERIOD: " + nextPeriod.slice(-4);
  const pbx = document.getElementById('pbx');
  pbx.innerText = finalPred;
  pbx.className = isBig ? 'ptxt t-big' : 'ptxt t-sml';
  document.getElementById("n1img").src = numberImages[n1];
document.getElementById("n2img").src = numberImages[n2];

  // add new prediction to history if not already present
  if (!history.find(h => h.period === nextPeriod)) {
    history.unshift({
      period: nextPeriod,
      bs: finalPred,
      nums: [n1, n2],
      res: '-',
      status: 'WAIT'
    });
    if (history.length > 20) history.pop();
    _sh(_s.m, history);
  }
  _r();
}

function _fn(entry, resultNumber){

entry.res = resultNumber;

let msg = document.getElementById("msgBox");


if(entry.nums.includes(resultNumber)){

    entry.status = "JACKPOT";

    msg.innerHTML="💥 JACKPOT 💥";
    msg.style.color="#ffd700";

}else{

    const predBig = (entry.bs === 'BIG');
    const resBig = (resultNumber >= 5);


    if(predBig === resBig){

        entry.status="WIN";

        msg.innerHTML="🤑 WIN";
        msg.style.color="#00ff00";

    }else{

        entry.status="LOSS";

        msg.innerHTML="😔 LOSS";
        msg.style.color="#ff0033";

    }

}


msg.style.display="block";


setTimeout(()=>{

msg.style.display="none";

},2300);


}

function _r() {
  const history = _s.m === '30S' ? _s.h3 : _s.h1;
  const html = history.map(h => `<div class="row"><div class="col">${h.period.slice(-4)}</div><div class="col" style="flex:1.5">
<span class="${h.bs==='BIG'?'big-signal':'small-signal'}">
${h.bs}
</span>
(${h.nums[0]},${h.nums[1]})
</div><div class="col" ><img class="history-num-img" src="${numberImages[h.res]}" style="width:45px;height:45px;border-radius:8px;border:2px solid #ffd700;object-fit:cover;box-shadow:0 0 15px #ffd700"></div><div class="col"><span class="${h.status === 'JACKPOT' ? 'jkpt' : (h.status === 'WIN' ? 'win' : (h.status === 'LOSS' ? 'loss' : 'wait'))}">${h.status==="WAIT"
? '<span class="pending"><i></i></span>'
: h.status}</span></div></div>`).join('');
  document.getElementById('hl').innerHTML = html;
}

function clr() {
  if (confirm('Clear local history & start fresh?')) {
    sessionStorage.clear();
    _s.h3 = [];
    _s.h1 = [];
    _r();
  }
}

// timer & auto refresh
setInterval(() => {
  const sec = new Date().getSeconds();
  const cycle = _s.m === '30S' ? 30 : 60;
  const remain = cycle - (sec % cycle);
  document.getElementById('tmr').innerText = `00:${remain.toString().padStart(2, '0')}`;
  if (remain === 1) _sy();  // fetch just before new period
}, 1000);

// initial load
_sy();

// also refresh on tab visibility (optional)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) _sy(true);
});
